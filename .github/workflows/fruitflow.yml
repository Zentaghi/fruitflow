name: Remplir la file TikTok

on:
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: fruitflow-queue
  cancel-in-progress: false

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Compléter la file Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: 1Mxstz4pRfiqMVbdQJdUys3J__rY8CvYa
          BUFFER_CHANNEL_ID: 6aa93f0dea19ca0bde4910e0
          TIMEZONE: Europe/Paris
          POST_TIMES: 13:45,16:45,18:45,20:45
          QUEUE_TARGET: "10"
        run: python fruitflow.py run

      - name: Actualiser le statut du site
        run: python scripts/build_status.py

      - name: Sauvegarder l’historique
        run: |
          git config user.name "fruitflow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fruitflow-state.json docs/status.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique de la file"
          git push
